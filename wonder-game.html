<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonder: Masked Evidence Challenge</title>
    <style>
        /* Wonder Book Cover Theme */
        @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Nunito:wght@400;700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #1b9ce3; /* Wonder Blue */
            background-image: radial-gradient(circle, #ffffff 2px, transparent 2px), radial-gradient(circle, #000000 1px, transparent 1px);
            background-size: 50px 50px, 30px 30px;
            background-position: 0 0, 25px 25px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            color: #000;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            max-width: 900px;
            width: 100%;
            text-align: center;
            border: 5px solid #000;
            position: relative;
        }

        h1 {
            font-family: 'Kalam', cursive;
            color: #1b9ce3;
            font-size: 3.5em;
            margin: 0 0 5px 0;
            text-shadow: 2px 2px 0px #000;
            line-height: 1;
        }

        /* Initial Setup Screen */
        #setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 40px 0;
        }

        #setup-screen h2 {
            font-size: 1.5em;
            margin: 0;
        }

        #team-count {
            font-size: 1.5em;
            padding: 10px;
            border: 3px solid #000;
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            width: 100px;
            text-align: center;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.5em;
            background-color: #1b9ce3;
            color: white;
            border: 3px solid #000;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 900;
            transition: transform 0.1s, background-color 0.3s;
        }

        .start-btn:hover {
            background-color: #1478b0;
            transform: scale(1.05);
        }

        /* Game Screen */
        #game-screen {
            display: none;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #000;
            color: #fff;
            padding: 15px 20px;
            border-radius: 15px;
        }

        .timer-board {
            font-size: 1.5em;
            font-weight: 900;
            color: #1b9ce3;
        }

        /* Scoreboard */
        .scoreboard-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .team-card {
            background: #f0f0f0;
            border: 3px solid #000;
            border-radius: 15px;
            padding: 10px 20px;
            min-width: 120px;
            text-align: center;
        }

        .team-name {
            font-weight: 900;
            font-size: 1.2em;
            margin-bottom: 5px;
            color: #1b9ce3;
        }

        .team-score {
            font-size: 2em;
            font-weight: 900;
            margin: 0;
        }

        .score-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }

        .score-btn {
            background: #fff;
            border: 2px solid #000;
            border-radius: 5px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 10px;
            transition: background 0.2s;
        }

        .score-btn:hover {
            background: #ddd;
        }

        .question {
            font-size: 1.6em;
            margin-bottom: 25px;
            font-weight: 900;
            color: #000;
        }

        .option {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: #fff;
            color: #000;
            border: 3px solid #000;
            border-radius: 15px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
        }

        .option:hover:not(:disabled) {
            background-color: #e0f2fe;
            transform: scale(1.01);
        }

        .option:disabled {
            cursor: not-allowed;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .correct {
            background-color: #22c55e !important;
            color: white !important;
            animation: pulse 0.5s;
        }

        .incorrect {
            background-color: #ef4444 !important;
            color: white !important;
            animation: shake 0.5s;
        }

        .feedback {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #1b9ce3;
            min-height: 50px;
        }

        #next-btn {
            margin-top: 15px;
            padding: 15px 40px;
            font-size: 1.3em;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            display: none;
            font-weight: 900;
            transition: transform 0.1s, background 0.3s;
        }

        #next-btn:hover {
            background-color: #333;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <h1>Wonder</h1>
        <h2>Masked Evidence Challenge</h2>
        <p>How many teams are playing today?</p>
        <input type="number" id="team-count" min="1" max="6" value="2">
        <button class="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <h1>Wonder</h1>
        
        <div class="header-bar">
            <div class="timer-board">Time: <span id="time">90</span>s</div>
        </div>

        <div class="scoreboard-container" id="scoreboard">
            <!-- Teams generated here -->
        </div>

        <div class="question" id="question-text">Question goes here</div>
        
        <div id="options-container">
            <!-- Options will be generated here -->
        </div>
        
        <div class="feedback" id="feedback"></div>
        <button id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>
</div>

<script>
    // Audio Context for Sound Effects
    let audioCtx;
    
    function playSound(type) {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'correct') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'incorrect') {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.4);
        }
    }

    // ESL Friendly Questions
    const quizData = [
        {
            question: "1. How do we know the narrator felt invisible?",
            options: [
                "A) He wore a Star Wars costume.",
                "B) Nobody looked at him for a long time.",
                "C) He sat near the back.",
                "D) The other children could not recognise him."
            ],
            correct: 1,
            explanation: "Paragraph 2 says: 'Nobody looked at me for longer than they looked at anyone else.'"
        },
        {
            question: "2. Which detail shows Jack's comment hurt the narrator deeply?",
            options: [
                "A) Jack said the principal asked him to help.",
                "B) The boys laughed.",
                "C) The narrator felt 'hot and hurt' under his mask.",
                "D) Jack said they were not best friends."
            ],
            correct: 2,
            explanation: "Paragraph 4 directly says: 'Under my mask, I felt hot and hurt.'"
        },
        {
            question: "3. How does the text show the narrator wanted to cry alone?",
            options: [
                "A) He left the classroom quickly.",
                "B) He did not want to speak to Jack.",
                "C) He wanted to take the mask off and cry.",
                "D) The rest of the day felt very long."
            ],
            correct: 0,
            explanation: "Paragraph 5 says: 'I stood up and left the classroom quickly.' This shows he wanted to leave."
        },
        {
            question: "4. What evidence shows the narrator's trust was broken?",
            options: [
                "A) Daisy licked his cheek.",
                "B) He thought about Jack's words again and again.",
                "C) He did not have to explain anything to his dog.",
                "D) He felt safe before, but now he did not know who to trust."
            ],
            correct: 3,
            explanation: "Paragraph 6 says: 'I had felt safe with him before. Now I did not know who I could trust.'"
        }
    ];

    let currentQuestion = 0;
    let timerInterval;
    let timeLeft = 90; // 1 minute 30 seconds
    let isAnswered = false;
    let teamScores = [];

    function startGame() {
        const numTeams = parseInt(document.getElementById('team-count').value);
        if (isNaN(numTeams) || numTeams < 1) return;

        // Initialize scores
        teamScores = new Array(numTeams).fill(0);
        
        // Setup scoreboard HTML
        const scoreboard = document.getElementById('scoreboard');
        scoreboard.innerHTML = '';
        for (let i = 0; i < numTeams; i++) {
            const card = document.createElement('div');
            card.className = 'team-card';
            card.innerHTML = `
                <div class="team-name">Team ${i + 1}</div>
                <div class="team-score" id="score-${i}">0</div>
                <div class="score-controls">
                    <button class="score-btn" onclick="adjustScore(${i}, -1)">-</button>
                    <button class="score-btn" onclick="adjustScore(${i}, 1)">+</button>
                </div>
            `;
            scoreboard.appendChild(card);
        }

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        loadQuestion();
    }

    function adjustScore(teamIndex, amount) {
        teamScores[teamIndex] += amount;
        document.getElementById(`score-${teamIndex}`).innerText = teamScores[teamIndex];
    }

    function loadQuestion() {
        isAnswered = false;
        timeLeft = 90;
        document.getElementById('time').innerText = timeLeft;
        
        clearInterval(timerInterval);
        document.getElementById('feedback').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        
        const q = quizData[currentQuestion];
        document.getElementById('question-text').innerText = q.question;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = "";
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => selectOption(index, btn);
            optionsContainer.appendChild(btn);
        });

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('time').innerText = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeOut();
            }
        }, 1000);
    }

    function timeOut() {
        if(isAnswered) return;
        isAnswered = true;
        
        const q = quizData[currentQuestion];
        const options = document.querySelectorAll('.option');
        
        options.forEach(opt => opt.disabled = true);
        options[q.correct].classList.add('correct');
        
        playSound('incorrect');
        document.getElementById('feedback').innerText = "Time's up! " + q.explanation;
        document.getElementById('next-btn').style.display = "inline-block";
    }

    function selectOption(selectedIndex, btn) {
        if(isAnswered) return;
        isAnswered = true;
        clearInterval(timerInterval);
        
        const q = quizData[currentQuestion];
        const options = document.querySelectorAll('.option');
        
        options.forEach(opt => opt.disabled = true);
        
        if (selectedIndex === q.correct) {
            btn.classList.add('correct');
            playSound('correct');
            document.getElementById('feedback').innerText = "Correct! " + q.explanation;
        } else {
            btn.classList.add('incorrect');
            options[q.correct].classList.add('correct');
            playSound('incorrect');
            document.getElementById('feedback').innerText = "Not quite. The correct answer is green. " + q.explanation;
        }
        
        document.getElementById('next-btn').style.display = "inline-block";
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showGameOver();
        }
    }

    function showGameOver() {
        clearInterval(timerInterval);
        document.querySelector('.header-bar').style.display = 'none';
        document.getElementById('question-text').innerHTML = "🌟 Activity Complete! 🌟";
        document.getElementById('options-container').innerHTML = `
            <p style="font-size: 1.5em; font-weight: bold; color: #1b9ce3;">
                Great job finding the text evidence!<br>
                Check the scoreboard to see the winner!
            </p>
        `;
        document.getElementById('feedback').innerText = "";
        document.getElementById('next-btn').style.display = "none";
    }
</script>

</body>
</html>
